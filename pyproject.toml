[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence"
version = "0.1.0"
description = "Multi-agent market intelligence ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser==6.0.14",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "langchain==1.4.5",
    "langchain-openai==1.7.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
]
# Streamlit 1.66 requires Python >=3.11.
demo = [
    "streamlit==1.66.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
