name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev and demo extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,demo]"
      - name: Run offline test suite (no network, no database)
        run: pytest --disable-socket -q -rs -m "not integration"

  integration:
    name: Postgres integration (Python 3.13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: market_intelligence_test
          POSTGRES_USER: market_intel
          # CI-only and deliberately passwordless. Acceptable because this
          # service container is ephemeral, reachable only inside this job's
          # isolated network, and holds synthetic test data. It is not a way
          # around the secret scanner; local development keeps its password
          # via docker-compose.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_intel -d market_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://market_intel@127.0.0.1:5432/market_intelligence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,demo]"
      - name: Refuse to run without a test database DSN
        run: python -c "import os, sys; sys.exit(0 if os.environ.get('TEST_DATABASE_URL', '').strip() else 1)"
      - name: Apply and verify the schema
        run: python scripts/init_db.py --dsn "$TEST_DATABASE_URL"
      - name: Run integration tests
        run: pytest -m integration -q -rs --junitxml=integration-junit.xml
      - name: Fail if the integration suite ran zero tests or skipped any
        run: |
          python -c "import sys, xml.etree.ElementTree as ET; suites = list(ET.parse('integration-junit.xml').getroot().iter('testsuite')); tests = sum(int(s.get('tests', 0)) for s in suites); skipped = sum(int(s.get('skipped', 0)) for s in suites); print(f'integration: tests={tests} skipped={skipped}'); sys.exit(0 if tests > 0 and skipped == 0 else 1)"

  lint:
    name: Pre-commit (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dev tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run pre-commit hooks against the committed baseline
        run: pre-commit run --all-files
